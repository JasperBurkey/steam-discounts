name: Run Notebook

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    # Quick estimation settings, so the notebook finishes in reasonable time on GitHub's
    # runners. The thesis results use LEARNER=ensemble, CF_REPEATS=3, HET_SPLITS=25,
    # HET_TREES=200 (see README).
    env:
      LEARNER: boost
      CF_REPEATS: "1"
      HET_SPLITS: "5"
      HET_TREES: "50"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml

      - name: Lint with ruff
        shell: micromamba-shell {0}
        run: |
          ruff check .
          ruff format --check .

      - name: Run notebook
        shell: micromamba-shell {0}
        run: |
          pytest tests/ -v
          pytest --nbmake --nbmake-timeout=3600 project.ipynb
