[project]
name = "steam-discounts"
version = "0.1.0"
description = "The impact of discounts during Steam seasonal sales: double machine learning on 2023-2026 sale events"
requires-python = ">=3.11"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Scripts that set up paths or plotting backends before importing project modules.
"pipeline/*.py" = ["E402"]
"pipeline/tests/*.py" = ["E402"]
"collector/*.py" = ["E402"]
"collector/tests/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["auxiliary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
